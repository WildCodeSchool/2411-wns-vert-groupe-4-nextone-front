name: E2E Tests

on:
  workflow_call: 

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create .env file for E2E tests
        run: |
          echo "POSTGRES_USER=utilisateur" >> .env
          echo "POSTGRES_PASSWORD=password" >> .env
          echo "POSTGRES_DB=nextone-db" >> .env
          echo "DATABASE_URL=postgresql://utilisateur:password@db:5432/nextone-db" >> .env
          echo "JWT_SECRET=test-secret-key-for-e2e" >> .env
          echo "NEXTONE_COMPANY_ID=9cdfb486-0e04-4929-a562-bdd0b4ab6637" >> .env
          echo "PLAYWRIGHT_BASE_URL=http://api_gateway" >> .env
          echo "BACKEND_URL=http://api_gateway/api" >> .env
          echo "NODE_ENV=development" >> .env
      
      - name: Run E2E tests with Docker Compose
        run: |
          docker-compose -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e
      
      - name: Stop and remove containers
        if: always()
        run: docker-compose -f docker-compose.e2e.yml down -v
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30