name: Deploy Frontend (Staging)

on:
  push:
    branches:
      - staging

jobs:
  test-frontend:
    uses: ./.github/workflows/frontend-pr-checks.yml

  build-frontend:
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build front
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_STAGING }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  docker:
    needs: [test-frontend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Copy build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nextone-front-staging:latest
          platforms: linux/amd64,linux/arm64,linux/x86_64

  wait-for-deployment:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Wait for automatic deployment to complete
        run: |
          echo "⏳ Attente que le système automatique déploie la nouvelle image..."
          echo "🔍 Vérification de la disponibilité de ${FRONTEND_URL}"

          MAX_ATTEMPTS=60  
          ATTEMPT=0

          echo "⏳ Pause initiale de 60 secondes pour laisser le temps au déploiement de démarrer..."
          sleep 60

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${FRONTEND_URL}" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Le site staging est accessible (HTTP $HTTP_CODE)"
              echo "✅ Déploiement automatique terminé avec succès"
              exit 0
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
            echo "⏳ Tentative $ATTEMPT/$MAX_ATTEMPTS - HTTP $HTTP_CODE - Attente de 10 secondes..."
            sleep 10
          done

          echo "❌ Le site n'est toujours pas accessible après $((MAX_ATTEMPTS * 10)) secondes"
          echo "❌ Le déploiement automatique a peut-être échoué"
          exit 1
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_STAGING_URL }}

  zap-scan:
    needs: wait-for-deployment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.FRONTEND_STAGING_URL }}
          fail_action: true
          cmd_options: "-I"

  accessibility-scan:
    needs: zap-scan
    uses: ./.github/workflows/accessibility-scan-workflow.yml
    secrets:
      FRONTEND_STAGING_URL: ${{ secrets.FRONTEND_STAGING_URL }}
