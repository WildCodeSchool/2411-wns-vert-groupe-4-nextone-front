name: Accessibility Scan

on:
  workflow_call:
  workflow_dispatch:

jobs:
  accessibility-scan:
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      FRONTEND_URL: ${{ secrets.FRONTEND_STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Pa11y dependencies
        run: |
          npm install -g pa11y-ci

      - name: Wait for deployment to be ready
        run: sleep 30

      - name: Verify environment
        run: |
          if [ -z "$FRONTEND_URL" ]; then
            echo "❌ FRONTEND_URL n'est pas défini"
            exit 1
          fi
          echo "✅ FRONTEND_URL est configuré"

      - name: Run Pa11y accessibility scan
        run: |
          echo "🔍 Scanning ${FRONTEND_URL}/terminal..."
          pa11y ${FRONTEND_URL}/terminal --standard WCAG2AA --reporter json > terminal.json || echo "⚠️ Error scanning terminal"

          echo "🔍 Scanning ${FRONTEND_URL}/login..."
          pa11y ${FRONTEND_URL}/login --standard WCAG2AA --reporter json > login.json || echo "⚠️ Error scanning login"

          echo "🔍 Scanning ${FRONTEND_URL}/dashboard..."
          pa11y ${FRONTEND_URL}/dashboard --standard WCAG2AA --reporter json > dashboard.json || echo "⚠️ Error scanning dashboard"

          echo ""
          echo "✅ Scans terminés"
          echo "📂 Fichiers générés:"
          ls -lh *.json || echo "❌ Aucun fichier JSON généré"

      - name: Display scan summary
        if: always()
        run: |
          echo "📊 Résumé du scan d'accessibilité"
          echo "=================================="
          echo ""

          if [ -f terminal.json ]; then
            echo "✅ /terminal"
            issues=$(cat terminal.json | jq '.issues | length' 2>/dev/null || echo "N/A")
            echo "   Issues: $issues"
          else
            echo "❌ /terminal - Rapport non généré"
          fi

          if [ -f login.json ]; then
            echo "✅ /login"
            issues=$(cat login.json | jq '.issues | length' 2>/dev/null || echo "N/A")
            echo "   Issues: $issues"
          else
            echo "❌ /login - Rapport non généré"
          fi

          if [ -f dashboard.json ]; then
            echo "✅ /dashboard"
            issues=$(cat dashboard.json | jq '.issues | length' 2>/dev/null || echo "N/A")
            echo "   Issues: $issues"
          else
            echo "❌ /dashboard - Rapport non généré"
          fi

      - name: Upload accessibility reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pa11y-accessibility-reports
          path: |
            *.json
          retention-days: 30
