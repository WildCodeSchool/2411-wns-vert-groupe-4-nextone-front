name: Accessibility Scan

on:
  workflow_call:
    secrets:
      FRONTEND_STAGING_URL:
        required: true
  workflow_dispatch:
    inputs:
      frontend_url:
        description: "URL du frontend à scanner"
        required: true
        type: string

jobs:
  accessibility-scan:
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      FRONTEND_URL: ${{ secrets.FRONTEND_STAGING_URL || inputs.frontend_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Pa11y dependencies
        run: |
          npm install -g pa11y-ci

      - name: Verify environment
        run: |
          if [ -z "$FRONTEND_URL" ]; then
            echo "❌ FRONTEND_URL n'est pas défini"
            exit 1
          fi
          echo "✅ FRONTEND_URL est configuré: $FRONTEND_URL"
          echo "✅ Pa11y-ci version:"
          pa11y-ci --version

      - name: Create Pa11y config file
        run: |
          cat > .pa11yci.json <<EOF
          {
            "defaults": {
              "standard": "WCAG2AA",
              "timeout": 30000,
              "chromeLaunchConfig": {
                "args": ["--no-sandbox", "--disable-setuid-sandbox"]
              }
            },
            "urls": [
              "${FRONTEND_URL}/terminal",
              "${FRONTEND_URL}/login",
              "${FRONTEND_URL}/dashboard"
            ]
          }
          EOF

          echo "📄 Fichier de configuration créé:"
          cat .pa11yci.json

      - name: Run Pa11y-CI accessibility scan
        run: |
          echo "🔍 Lancement du scan d'accessibilité avec pa11y-ci..."
          pa11y-ci --json > pa11y-results.json || true

          echo ""
          echo "✅ Scan terminé"

      - name: Display scan summary
        if: always()
        run: |
          echo "📊 Résumé du scan d'accessibilité"
          echo "=================================="
          echo ""

          if [ -f pa11y-results.json ] && [ -s pa11y-results.json ]; then
            echo "✅ Résultats disponibles"
            
            # Afficher un résumé pour chaque URL
            for url in "terminal" "login" "dashboard"; do
              echo ""
              echo "📄 /${url}:"
              
              cat pa11y-results.json | jq -r ".[] | select(.pageUrl | contains(\"/${url}\")) | .issues | length" 2>/dev/null || echo "   Analyse en cours..."
            done
            
            echo ""
            echo "📂 Voir le fichier pa11y-results.json pour les détails complets"
          else
            echo "❌ Aucun résultat généré"
          fi

      - name: Upload accessibility reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pa11y-accessibility-reports
          path: |
            pa11y-results.json
            .pa11yci.json
          retention-days: 30
