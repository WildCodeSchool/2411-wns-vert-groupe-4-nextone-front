name: Accessibility Scan

on:
  workflow_call:

jobs:
  accessibility-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Pa11y dependencies
        run: |
          npm install -g pa11y-ci pa11y-reporter-html

      - name: Wait for deployment to be ready
        run: sleep 30

      - name: Create Pa11y config
        run: |
          cat > .pa11yci << EOF
          {
            "defaults": {
              "standard": "WCAG2AA",
              "timeout": 30000,
              "wait": 1000,
              "chromeLaunchConfig": {
                "args": ["--no-sandbox", "--disable-setuid-sandbox"]
              },
              "reporters": [
                ["html", { "destination": "pa11y-results.html" }],
                ["json", { "destination": "pa11y-results.json" }]
              ]
            },
            "urls": [
              "${{ secrets.FRONTEND_STAGING_URL }}/terminal",
              "${{ secrets.FRONTEND_STAGING_URL }}/login",
              "${{ secrets.FRONTEND_STAGING_URL }}/dashboard"
            ]
          }
          EOF

      - name: Run Pa11y CI accessibility scan
        run: |
          pa11y-ci || true

      - name: Display scan summary
        if: always()
        run: |
          echo "📊 Scan d'accessibilité Pa11y terminé"
          echo "Les rapports détaillés sont disponibles dans les artifacts"
          if [ -f pa11y-results.json ]; then
            echo "✅ Rapport JSON généré"
            # Compte le nombre total d'issues
            total_issues=$(cat pa11y-results.json | jq '[.[] | .issues | length] | add' || echo "N/A")
            echo "🔍 Total d'issues trouvées: $total_issues"
          fi
          if [ -f pa11y-results.html ]; then
            echo "✅ Rapport HTML généré"
          fi

      - name: Upload accessibility reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pa11y-accessibility-reports
          path: |
            pa11y-results.json
            pa11y-results.html
            .pa11yci
          retention-days: 30
